<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Face Attendance{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">◉</div>
      <div><b>Face Attendance</b><small>Management System</small></div>
    </div>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint=='dashboard' %}active{% endif %}">⌂ <span>Dashboard</span></a>
      <a href="{{ url_for('enroll') }}" class="{% if request.endpoint=='enroll' %}active{% endif %}">♙ <span>Enroll Student</span></a>
      <a href="{{ url_for('attendance') }}" class="{% if request.endpoint=='attendance' %}active{% endif %}">▣ <span>Take Attendance</span></a>
      <a href="{{ url_for('students') }}" class="{% if request.endpoint=='students' %}active{% endif %}">♟ <span>Students</span></a>
      <a href="{{ url_for('records') }}" class="{% if request.endpoint=='records' %}active{% endif %}">▤ <span>Attendance Records</span></a>
    </nav>
    <a class="logout" href="{{ url_for('logout') }}">⇥ Logout</a>
  </aside>
  <main class="main">
    <header class="topbar">
      <div></div>
      <div class="admin">● &nbsp; Admin ▾</div>
    </header>
    {% block content %}{% endblock %}
  </main>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
